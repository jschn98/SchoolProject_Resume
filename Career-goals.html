         <section>
    <h2>Contact Me</h2>

    <form action="https://wp.zybooks.com/form-viewer.php">

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName">

        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">

        <br><br>

        <label for="company">Company Name:</label>
        <input type="text" id="company" name="company">

        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>

        <br><br>

        <p>Best Contact Time:</p>

        <input type="radio" id="am" name="contactTime" value="a.m.">
        <label for="am">a.m.</label>

        <input type="radio" id="pm" name="contactTime" value="p.m.">
        <label for="pm">p.m.</label>

        <input type="radio" id="anytime" name="contactTime" value="anytime">
        <label for="anytime">anytime</label>

        <br><br>

        <label for="contactMethod">Preferred Contact Method:</label>

        <select id="contactMethod" name="contactMethod">
            <option value="phone">phone</option>
            <option value="email">email</option>
            <option value="text">text</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">

    </form>
